<title>Oh Duck It — Page moved</title>
<script>
(() => {
  const map = {
    'guild-management.html':'officers.html',
    'guild-management-roles.html':'officer-roles.html',
    'guild-management-recruitment-ownership.html':'officer-recruitment-ownership.html',
    'guild-management-progression.html':'officer-progression.html',
    'guild-management-recruitment.html':'officer-recruitment-priorities.html',
    'guild-management-resources.html':'officer-resources.html',
    'guild-management-permissions.html':'officer-permissions.html',
    'guild-management-guild-info.html':'officer-guild-info.html',
    'guild-management-logs.html':'officer-logs.html',
    'guild-management-settings.html':'officer-settings.html'
  };

  const file = location.pathname.split('/').pop();
  const target = map[file];

  if (target) {
    const base = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
    location.replace(base + target + location.search + location.hash);
  }
})();
</script>
